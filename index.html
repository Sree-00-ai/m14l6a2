<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Form Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            padding: 30px;
        }

        .container {
            max-width: 350px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Registration Form</h2>

        <form id="myForm">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">

            <button type="submit" id="submitBtn">Validate Email</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        const form = document.getElementById("myForm");
        const message = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();

            // Step 1: Basic validation
            if (name === "" || email === "") {
                message.style.color = "red";
                message.textContent = "Please fill in all fields.";
                return;
            }

            // Step 2: Show loading message
            message.style.color = "black";
            message.textContent = "Checking email using API...";
            submitBtn.disabled = true;

            try {
                // Step 3: Call the API
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!response.ok) {
                    throw new Error("API request failed");
                }

                // Step 4: Convert response into JavaScript data
                const users = await response.json();

                // Step 5: Check whether email exists in sample data
                const userFound = users.some(function(user) {
                    return user.email.toLowerCase() === email.toLowerCase();
                });

                // Step 6: Display the result
                if (userFound) {
                    message.style.color = "green";
                    message.textContent =
                        "Email found in sample data! Welcome, " + name + ".";
                } else {
                    message.style.color = "red";
                    message.textContent =
                        "Email not found in the sample data.";
                }

            } catch (error) {
                message.style.color = "red";
                message.textContent =
                    "Unable to contact the API. Please try again.";
                console.error(error);

            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>

</body>

</html>
